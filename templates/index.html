<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetChat | Social Hybrid</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root {
            --accent: #a855f7;
            --bg: #020617;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --gradient: linear-gradient(135deg, #1e1b4b 0%, #020617 100%);
        }

        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--gradient); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

        /* --- SIDEBAR (TELEGRAM STYLE) --- */
        .sidebar { width: 350px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; transition: 0.4s; z-index: 1000; }
        .side-header { padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .user-card { padding: 15px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; border-radius: 15px; margin: 5px 10px; }
        .user-card:hover { background: rgba(168, 85, 247, 0.1); }
        .online-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; border: 2px solid #0f172a; position: absolute; bottom: 0; right: 0; }

        /* --- FEED/CHAT (INSTAGRAM STYLE) --- */
        .feed-container { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at top right, rgba(168, 85, 247, 0.15), transparent); }
        .feed-header { padding: 15px 25px; background: rgba(2, 6, 23, 0.5); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .posts-area { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; display: flex; flex-direction: column; align-items: center; }

        /* POST CARD */
        .post { width: 100%; max-width: 500px; background: var(--card); border-radius: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; animation: fadeInUp 0.5s ease; }
        .post-head { padding: 12px 15px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
        .post-content { width: 100%; background: #000; display: flex; justify-content: center; }
        .post-content img, .post-content video { width: 100%; max-height: 500px; object-fit: contain; }
        .post-info { padding: 15px; }
        .post-text { font-size: 14px; margin-top: 8px; line-height: 1.5; opacity: 0.9; }
        .post-actions { display: flex; gap: 15px; margin-top: 10px; font-size: 20px; color: var(--accent); }

        /* --- INPUT AREA --- */
        .input-wrapper { padding: 20px; display: flex; justify-content: center; }
        .input-box { width: 100%; max-width: 600px; background: rgba(255,255,255,0.05); border-radius: 30px; display: flex; align-items: center; padding: 5px 15px; border: 1px solid rgba(255,255,255,0.1); }
        .input-box input { flex: 1; background: none; border: none; color: white; padding: 12px; outline: none; }

        /* --- MOBILE --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.95); display: none; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        @media (max-width: 768px) { .sidebar { display: none; } .bottom-nav { display: flex; } .feed-container { padding-bottom: 70px; } }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="auth-modal" class="modal" style="position:fixed; inset:0; background:#020617; z-index:9999; display:flex; align-items:center; justify-content:center;">
        <div style="background:#1e293b; padding:40px; border-radius:30px; text-align:center; width:90%; max-width:400px; border:1px solid var(--accent);">
            <h1 style="background:linear-gradient(to right, #a855f7, #6366f1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:40px; margin-bottom:10px;">NetChat</h1>
            <div id="login-section">
                <button onclick="login()" style="width:100%; padding:15px; border-radius:15px; border:none; background:var(--accent); color:white; font-weight:bold; cursor:pointer;">Google bilan boshlash</button>
            </div>
            <div id="reg-section" style="display:none; text-align:left; margin-top:20px;">
                <input type="text" id="r-user" placeholder="@username" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; background:#0f172a; border:1px solid #334155; color:white;">
                <textarea id="r-bio" placeholder="Bio..." style="width:100%; padding:12px; height:80px; border-radius:10px; background:#0f172a; border:1px solid #334155; color:white; resize:none;"></textarea>
                <button onclick="saveProfile()" style="width:100%; padding:15px; border-radius:15px; border:none; background:var(--accent); color:white; font-weight:bold; cursor:pointer;">Profilingizni yarating</button>
            </div>
        </div>
    </div>

    <aside class="sidebar">
        <div class="side-header">
            <h2 id="my-username" style="color:var(--accent); margin:0;">@username</h2>
            <small style="opacity:0.5;">Global Community</small>
        </div>
        <div id="users-list" style="flex:1; overflow-y:auto; padding-top:10px;"></div>
    </aside>

    <main class="feed-container">
        <header class="feed-header">
            <h3 style="margin:0;">Global Feed</h3>
            <i class="fas fa-paper-plane" style="font-size:20px; color:var(--accent);"></i>
        </header>

        <div class="posts-area" id="posts-container">
            </div>

        <div class="input-wrapper">
            <div class="input-box">
                <label for="media-up" style="cursor:pointer; padding:10px;"><i class="fas fa-camera" style="font-size:20px; color:var(--accent);"></i></label>
                <input type="file" id="media-up" hidden onchange="uploadPost(this)">
                <input type="text" id="post-text" placeholder="Nima gaplar?..." onkeypress="if(event.key==='Enter') sendText()">
                <button onclick="sendText()" style="background:none; border:none; padding:10px;"><i class="fas fa-arrow-up" style="font-size:20px; color:var(--accent);"></i></button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <i class="fas fa-home" style="color:var(--accent); font-size:24px;"></i>
        <i class="fas fa-search" style="font-size:24px; opacity:0.6;"></i>
        <i class="fas fa-plus-circle" onclick="document.getElementById('media-up').click()" style="font-size:30px; color:var(--accent);"></i>
        <i class="fas fa-heart" style="font-size:24px; opacity:0.6;"></i>
        <i class="fas fa-user-circle" style="font-size:24px; opacity:0.6;"></i>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBqKqszWBCMrKIjN0Wb9PxC7wArkjd5FSU",
            authDomain: "netchat-52007.firebaseapp.com",
            databaseURL: "https://netchat-52007-default-rtdb.firebaseio.com",
            projectId: "netchat-52007",
            storageBucket: "netchat-52007.firebasestorage.app",
            messagingSenderId: "145404562699",
            appId: "1:145404562699:web:5eeb4c6abc3e18675b660e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const store = firebase.storage();

        let userData = null;

        // AUTH
        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(res => {
                db.ref('users/' + res.user.uid).once('value', snap => {
                    if(snap.exists()) { userData = snap.val(); startApp(); }
                    else { document.getElementById('login-section').style.display='none'; document.getElementById('reg-section').style.display='block'; }
                });
            });
        }

        function saveProfile() {
            const u = auth.currentUser;
            const uname = document.getElementById('r-user').value.trim();
            if(!uname) return alert("Username kiriting!");
            userData = {
                uid: u.uid,
                fullname: u.displayName,
                username: uname.startsWith('@') ? uname : '@' + uname,
                bio: document.getElementById('r-bio').value || "NetChat o'quvchisi",
                pic: u.photoURL
            };
            db.ref('users/' + u.uid).set(userData).then(startApp);
        }

        function startApp() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('my-username').innerText = userData.username;
            loadPosts();
            loadUsers();
        }

        // POSTS
        function sendText() {
            const txt = document.getElementById('post-text').value;
            if(!txt.trim()) return;
            pushToDB({ type: 'text', content: txt });
            document.getElementById('post-text').value = "";
        }

        function uploadPost(input) {
            const file = input.files[0];
            if(!file) return;
            const ref = store.ref(`social/${Date.now()}_${file.name}`);
            ref.put(file).then(s => s.ref.getDownloadURL()).then(url => {
                let t = file.type.startsWith('image/') ? 'img' : (file.type.startsWith('video/') ? 'vid' : 'file');
                pushToDB({ type: t, content: url, fileName: file.name });
            });
        }

        function pushToDB(data) {
            db.ref('posts').push({
                ...data, uid: userData.uid, username: userData.username, pic: userData.pic, time: Date.now()
            });
        }

        function loadPosts() {
            db.ref('posts').on('child_added', snap => {
                const p = snap.val();
                let media = "";
                if(p.type === 'img') media = `<div class="post-content"><img src="${p.content}"></div>`;
                else if(p.type === 'vid') media = `<div class="post-content"><video controls src="${p.content}"></video></div>`;
                
                const html = `
                    <div class="post" id="${snap.key}">
                        <div class="post-head">
                            <div style="width:35px; height:35px; border-radius:50%; background:var(--accent); overflow:hidden;">
                                <img src="${p.pic}" style="width:100%; height:100%;">
                            </div>
                            <span>${p.username}</span>
                            ${p.uid === userData.uid ? `<i class="fas fa-trash" onclick="deletePost('${snap.key}')" style="margin-left:auto; opacity:0.5; cursor:pointer;"></i>` : ''}
                        </div>
                        ${media}
                        <div class="post-info">
                            <div class="post-actions"><i class="far fa-heart"></i> <i class="far fa-comment"></i> <i class="far fa-paper-plane"></i></div>
                            <div class="post-text"><b>${p.username}</b> ${p.type === 'text' ? p.content : (p.fileName || '')}</div>
                            <small style="opacity:0.4; font-size:10px;">${new Date(p.time).toLocaleString()}</small>
                        </div>
                    </div>`;
                const container = document.getElementById('posts-container');
                container.innerHTML = html + container.innerHTML;
            });
            db.ref('posts').on('child_removed', snap => document.getElementById(snap.key).remove());
        }

        function deletePost(id) { if(confirm("O'chirilsinmi?")) db.ref('posts/' + id).remove(); }

        function loadUsers() {
            db.ref('users').on('value', snap => {
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                snap.forEach(c => {
                    const u = c.val();
                    list.innerHTML += `
                        <div class="user-card" onclick="alert('Bio: ${u.bio}')">
                            <div style="position:relative; width:45px; height:45px; border-radius:50%; background:var(--accent); overflow:hidden;">
                                <img src="${u.pic}" style="width:100%; height:100%;">
                                <div class="online-dot"></div>
                            </div>
                            <div>
                                <div style="font-weight:600;">${u.fullname}</div>
                                <div style="font-size:12px; opacity:0.6;">${u.username}</div>
                            </div>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
