<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGlobal OS | Premium Social</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div id="auth-screen" class="win-lock-screen">
        <div class="auth-card">
            <div class="ng-logo-large">
                <div class="logo-box">N</div>
                <h1>Net<span>Global</span> OS</h1>
            </div>
            <div id="login-ui">
                <p>Xush kelibsiz, tizimga kiring</p>
                <button class="win-prime-btn" id="btnLoginGoogle">
                    <i class="fab fa-google"></i> Google bilan kirish
                </button>
            </div>
            <div id="reg-ui" style="display:none;">
                <input type="text" id="os-username-input" placeholder="@username tanlang" class="win-input">
                <button class="win-prime-btn" id="btnCompleteProfile">Tizimni yaratish</button>
            </div>
        </div>
    </div>

    <div class="app-container" id="main-os" style="display:none;">
        
        <aside class="win-sidebar">
            <div class="sidebar-header">
                <div class="logo-mini">N</div>
                <span class="logo-text">Net<span>Global</span></span>
            </div>
            
            <nav class="side-nav">
                <div class="nav-item active"><i class="fa-solid fa-house"></i> <span>Asosiy</span></div>
                <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> <span>Qidiruv</span></div>
                <div class="nav-item"><i class="fa-solid fa-compass"></i> <span>Explore</span></div>
                <div class="nav-item" id="btnOpenCompose"><i class="fa-solid fa-square-plus"></i> <span>Yaratish</span></div>
                <div class="nav-item"><i class="fa-solid fa-paper-plane"></i> <span>Xabarlar</span></div>
                <div class="nav-item"><i class="fa-solid fa-heart"></i> <span>Bildirishnoma</span></div>
                <div class="nav-item" id="user-profile-btn">
                    <img id="top-avatar-img" src="" class="nav-avatar"> <span>Profil</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="nav-item"><i class="fa-solid fa-bars"></i> <span>Yana</span></div>
            </div>
        </aside>

        <main class="content-wrapper">
            
            <div class="stories-container" id="stories-cont">
                <div class="story-item">
                    <div class="story-ring"><img src="https://via.placeholder.com/150"></div>
                    <span>Siz</span>
                </div>
            </div>

            <div class="insta-feed" id="feed-stream-cont">
                </div>
        </main>

    </div>

    <div class="modal-overlay" id="compose-widget-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Yangi post yaratish</h3>
                <i class="fa-solid fa-xmark" id="btnCloseCompose"></i>
            </div>
            <div class="modal-body">
                <textarea id="post-caption-input" placeholder="Fikringizni yozing..."></textarea>
                <div class="upload-zone">
                    <label for="media-file-upload">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Rasm yoki video yuklash</span>
                    </label>
                    <input type="file" id="media-file-upload" hidden>
                </div>
                <button class="win-prime-btn" id="btnPublishPost">Ulashish</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
