<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGlobal Team | OS Experience</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        /* --- WINDOWS 11 & MAGIC OS VARIABLES --- */
        :root {
            --win-bg: linear-gradient(135deg, #020617 0%, #0f172a 40%, #2e1065 100%);
            --acrylic: rgba(255, 255, 255, 0.03);
            --mica: rgba(15, 23, 42, 0.4);
            --border: 1px solid rgba(255, 255, 255, 0.08);
            --blur: blur(30px) saturate(150%);
            --accent: #a855f7;
            --accent-hover: #c084fc;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--win-bg); color: var(--text-main); 
            height: 100vh; overflow: hidden; display: flex; justify-content: center;
        }

        /* --- AUTH SCREEN (Win11 Lock Screen Style) --- */
        .auth-overlay {
            position: fixed; inset: 0; background: var(--win-bg); z-index: 9999;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .auth-card {
            background: var(--acrylic); backdrop-filter: var(--blur);
            border: var(--border); border-radius: var(--radius-lg);
            padding: 40px; width: 90%; max-width: 420px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); animation: zoomIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .win-input {
            width: 100%; padding: 14px 20px; margin: 10px 0; border-radius: var(--radius-md);
            background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            color: white; outline: none; transition: 0.3s; box-sizing: border-box; font-size: 15px;
        }
        .win-input:focus { border-color: var(--accent); background: rgba(0,0,0,0.4); }
        .win-btn {
            width: 100%; padding: 15px; border-radius: var(--radius-md); border: none;
            background: var(--accent); color: white; font-weight: 600; font-size: 16px;
            cursor: pointer; transition: 0.3s; margin-top: 15px;
        }
        .win-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

        /* --- APP CONTAINER (MagicOS Floating Window) --- */
        .app-window {
            width: 100%; max-width: 1200px; height: 100vh;
            display: flex; flex-direction: column; position: relative;
        }

        /* --- TOP HEADER (Win11 Titlebar) --- */
        .app-header {
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(2,6,23,0.8), transparent); z-index: 100;
        }
        .brand-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        .brand-title span { color: var(--accent); }

        /* --- MAIN FEED (Instagram Professional Style) --- */
        .feed-scroll {
            flex: 1; overflow-y: auto; padding: 0 20px 120px 20px; 
            display: flex; flex-direction: column; align-items: center; gap: 30px;
        }
        .feed-scroll::-webkit-scrollbar { display: none; }

        .post-widget {
            width: 100%; max-width: 550px; background: var(--mica);
            backdrop-filter: var(--blur); border: var(--border);
            border-radius: var(--radius-lg); overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: fadeUp 0.6s ease;
        }
        .post-header { padding: 15px 20px; display: flex; align-items: center; gap: 12px; }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .post-media { width: 100%; max-height: 600px; background: #000; display: flex; justify-content: center; }
        .post-media img, .post-media video { width: 100%; height: auto; object-fit: contain; }
        .post-body { padding: 20px; }
        .post-actions { display: flex; gap: 20px; font-size: 24px; margin-bottom: 12px; }
        .action-icon { cursor: pointer; transition: 0.2s; color: var(--text-main); }
        .action-icon:hover { color: var(--accent); transform: scale(1.1); }
        .post-caption b { font-weight: 600; margin-right: 8px; }

        /* --- CENTERED DOCK (Win11 / macOS Taskbar) --- */
        .win-dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--mica); backdrop-filter: var(--blur); border: var(--border);
            padding: 12px 25px; border-radius: 35px; display: flex; gap: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); z-index: 1000;
        }
        .dock-item {
            width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--text-sub); cursor: pointer; transition: 0.3s;
        }
        .dock-item:hover, .dock-item.active {
            background: var(--acrylic); color: var(--accent); transform: translateY(-5px);
        }
        .create-btn {
            background: var(--accent); color: white; box-shadow: 0 0 20px rgba(168,85,247,0.4);
        }
        .create-btn:hover { background: var(--accent-hover); color: white; }

        /* --- GLASS INPUT MODAL (MagicOS Style) --- */
        .compose-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .compose-card {
            background: var(--mica); border: var(--border); border-radius: var(--radius-lg);
            width: 90%; max-width: 500px; padding: 25px; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <h1 style="font-size: 45px; margin-bottom: 30px; font-weight: 300;">Xush kelibsiz</h1>
        <div class="auth-card">
            <h2 class="brand-title" style="margin-top:0;">Net<span>Global</span> OS</h2>
            
            <div id="login-ui">
                <p style="color: var(--text-sub); margin-bottom: 25px;">Tizimga kirish uchun hisobingizni tasdiqlang</p>
                <button class="win-btn" onclick="sysLogin()"><i class="fab fa-google"></i> Google Identity</button>
            </div>

            <div id="reg-ui" style="display:none; text-align: left;">
                <label style="font-size: 13px; color: var(--text-sub); margin-left: 10px;">Foydalanuvchi nomi</label>
                <input type="text" id="os-user" placeholder="@username" class="win-input">
                <label style="font-size: 13px; color: var(--text-sub); margin-left: 10px; margin-top: 10px; display:block;">Bio / Status</label>
                <input type="text" id="os-bio" placeholder="Mingbuloq maktabi o'quvchisi" class="win-input">
                <button class="win-btn" onclick="sysSetup()">Tizimni ishga tushirish</button>
            </div>
        </div>
    </div>

    <div class="app-window" id="main-os" style="display:none;">
        <header class="app-header">
            <div class="brand-title">Net<span>Global</span></div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <b id="top-username" style="font-size: 14px; font-weight: 500;">@user</b>
                <img id="top-avatar" src="" style="width:35px; height:35px; border-radius:50%; border:2px solid rgba(255,255,255,0.2);">
            </div>
        </header>

        <div class="feed-scroll" id="feed-stream">
            </div>

        <nav class="win-dock">
            <div class="dock-item active" onclick="alert('Lenta sahifasi')"><i class="fas fa-home"></i></div>
            <div class="dock-item" onclick="alert('Qidiruv funksiyasi tez orada!')"><i class="fas fa-search"></i></div>
            <div class="dock-item create-btn" onclick="openCompose()"><i class="fas fa-plus"></i></div>
            <div class="dock-item" onclick="alert('Xabarlar tizimi tez orada!')"><i class="fas fa-comment-alt"></i></div>
            <div class="dock-item" onclick="showOsProfile()"><i class="fas fa-user"></i></div>
        </nav>
    </div>

    <div class="compose-overlay" id="compose-widget">
        <div class="compose-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin:0; font-weight:500;">Yangi Post</h3>
                <i class="fas fa-times action-icon" onclick="closeCompose()"></i>
            </div>
            
            <textarea id="post-text" placeholder="Fikringizni yozing..." class="win-input" style="height: 100px; resize:none; border:none; background:rgba(0,0,0,0.3);"></textarea>
            
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <label for="media-upload" class="win-btn" style="flex:1; background:rgba(255,255,255,0.1); color:white; text-align:center; margin:0;"><i class="fas fa-image"></i> Media tanlash</label>
                <input type="file" id="media-upload" hidden onchange="uploadOsMedia(this)">
                <button class="win-btn" style="flex:1; margin:0;" onclick="sendOsPost()"><i class="fas fa-paper-plane"></i> Ulashish</button>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CORE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBqKqszWBCMrKIjN0Wb9PxC7wArkjd5FSU",
            authDomain: "netchat-52007.firebaseapp.com",
            databaseURL: "https://netchat-52007-default-rtdb.firebaseio.com",
            projectId: "netchat-52007",
            storageBucket: "netchat-52007.firebasestorage.app",
            messagingSenderId: "145404562699",
            appId: "1:145404562699:web:5eeb4c6abc3e18675b660e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let osUser = null;

        // --- AUTHENTICATION ---
        function sysLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(res => {
                db.ref('users/' + res.user.uid).once('value', snap => {
                    if(snap.exists()) {
                        osUser = snap.val();
                        bootOS();
                    } else {
                        document.getElementById('login-ui').style.display = 'none';
                        document.getElementById('reg-ui').style.display = 'block';
                    }
                });
            });
        }

        function sysSetup() {
            const u = auth.currentUser;
            const uname = document.getElementById('os-user').value.trim();
            if(uname.length < 3) return alert("Username ni to'g'ri kiriting!");
            
            osUser = {
                uid: u.uid,
                name: u.displayName,
                username: uname.startsWith('@') ? uname : '@' + uname,
                bio: document.getElementById('os-bio').value || "NetGlobal jamoasi a'zosi",
                avatar: u.photoURL
            };
            db.ref('users/' + u.uid).set(osUser).then(bootOS);
        }

        function bootOS() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-os').style.display = 'flex';
            document.getElementById('top-username').innerText = osUser.username;
            document.getElementById('top-avatar').src = osUser.avatar;
            streamPosts();
        }

        // --- POSTING & UI WIDGETS ---
        function openCompose() { document.getElementById('compose-widget').style.display = 'flex'; }
        function closeCompose() { document.getElementById('compose-widget').style.display = 'none'; }

        function sendOsPost() {
            const txt = document.getElementById('post-text').value;
            if(!txt.trim()) return;
            publish({ type: 'text', content: txt });
            document.getElementById('post-text').value = "";
            closeCompose();
        }

        function uploadOsMedia(input) {
            const file = input.files[0];
            if(!file) return;
            const ref = storage.ref(`os_media/${Date.now()}_${file.name}`);
            ref.put(file).then(s => s.ref.getDownloadURL()).then(url => {
                let mType = file.type.startsWith('image/') ? 'img' : (file.type.startsWith('video/') ? 'vid' : 'file');
                publish({ type: mType, content: url, filename: file.name });
                closeCompose();
            });
        }

        function publish(data) {
            db.ref('os_posts').push({
                ...data, uid: osUser.uid, username: osUser.username, avatar: osUser.avatar, time: Date.now()
            });
        }

        // --- FEED RENDER (Instagram Style + Windows Mica) ---
        function streamPosts() {
            db.ref('os_posts').on('child_added', snap => {
                const p = snap.val();
                let mediaElement = "";
                
                if(p.type === 'img') mediaElement = `<div class="post-media"><img src="${p.content}"></div>`;
                else if(p.type === 'vid') mediaElement = `<div class="post-media"><video controls src="${p.content}"></video></div>`;
                
                const html = `
                <div class="post-widget" id="post-${snap.key}">
                    <div class="post-header">
                        <img src="${p.avatar}" class="post-avatar">
                        <div>
                            <div style="font-weight: 600; font-size: 15px;">${p.username}</div>
                            <div style="font-size: 11px; color: var(--text-sub);">${new Date(p.time).toLocaleString()}</div>
                        </div>
                        ${p.uid === osUser.uid ? `<i class="fas fa-ellipsis-h action-icon" style="margin-left:auto;" onclick="delOsPost('${snap.key}')"></i>` : ''}
                    </div>
                    ${mediaElement}
                    <div class="post-body">
                        <div class="post-actions">
                            <i class="far fa-heart action-icon" onclick="this.classList.toggle('fas'); this.classList.toggle('far'); this.style.color = this.classList.contains('fas') ? '#ec4899' : '';"></i>
                            <i class="far fa-comment action-icon"></i>
                            <i class="far fa-paper-plane action-icon"></i>
                        </div>
                        <div class="post-caption">
                            <b>${p.username}</b> ${p.type === 'text' ? p.content : (p.filename || 'Yangi media yuklandi')}
                        </div>
                    </div>
                </div>`;
                
                const feed = document.getElementById('feed-stream');
                feed.innerHTML = html + feed.innerHTML;
            });
            
            db.ref('os_posts').on('child_removed', snap => {
                const el = document.getElementById('post-' + snap.key);
                if(el) el.remove();
            });
        }

        function delOsPost(id) { if(confirm("Postni o'chirishni tasdiqlaysizmi?")) db.ref('os_posts/' + id).remove(); }

        function showOsProfile() {
            alert(`Sistemadagi profil:\n\nFoydalanuvchi: ${osUser.name}\nUsername: ${osUser.username}\nBio/Status: ${osUser.bio}`);
        }
    </script>
</body>
</html>
